<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odung Games - 오둥 게임즈</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Pretendard & Inter -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-6px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 상단 네비게이션 바 -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                    <span class="text-xl">🎮</span>
                </div>
                <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    Odung Games
                </span>
            </a>
            <nav class="flex items-center gap-4">
                <span class="text-xs sm:text-sm px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-400">
                    odunggames.github.io
                </span>
            </nav>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="relative overflow-hidden py-12 sm:py-20 px-4 sm:px-6 lg:px-8">
        <!-- 배경 장식 효과 -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-indigo-600/20 blur-[120px] rounded-full pointer-events-none"></div>
        
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-sm font-medium mb-6">
                <span>✨</span> 웹에서 바로 즐기는 미니게임 천국
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4 leading-tight">
                심심할 땐 언제든지,<br class="sm:hidden" />
                <span class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    오둥 게임즈
                </span>
            </h1>
            <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto mb-8">
                별도의 설치 없이 브라우저에서 바로 플레이할 수 있는 다양한 웹 게임들을 만나보세요.
            </p>

            <!-- 카테고리 필터 버튼 -->
            <div id="category-filters" class="flex flex-wrap justify-center gap-2">
                <button data-category="all" class="filter-btn active px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all">
                    전체 게임
                </button>
                <button data-category="multi" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition-all">
                    멀티 / 파티
                </button>
                <button data-category="arcade" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition-all">
                    아케이드 / 퍼즐
                </button>
            </div>
        </div>
    </section>

    <!-- 게임 목록 그리드 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 자바스크립트를 통해 게임 카드가 동적으로 렌더링됩니다 -->
        </div>
    </main>

    <!-- 알림 메시지 모달 (alert 대체용) -->
    <div id="toast-modal" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
            <span class="text-lg">🚧</span>
            <p id="toast-message" class="text-sm font-medium">아직 준비 중인 게임입니다!</p>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 px-4 text-center text-slate-500 text-sm">
        <p>© 2026 Odung Games. All rights reserved.</p>
    </footer>

    <script>
        // 게임 데이터 목록 (추후 새 게임을 만들면 여기에 객체만 추가하면 됩니다!)
        const gamesList = [
            {
                id: 'catchmind',
                title: '캐치마인드 (CatchMind)',
                description: '제시어를 보고 그림을 그리면 친구들이 정답을 맞추는 실시간 그림 퀴즈 게임!',
                url: './catchmind/', // odunggames.github.io/catchmind 로 이동
                category: 'multi',
                badge: '인기 🔥',
                badgeColor: 'bg-rose-500/20 text-rose-400 border-rose-500/30',
                gradient: 'from-amber-400 to-orange-500',
                icon: '🎨',
                isReady: true
            },
            {
                id: 'coming-soon-1',
                title: '오둥이 피하기',
                description: '하늘에서 떨어지는 장애물을 피해 최고 점수에 도전하는 아케이드 게임입니다.',
                url: '#coming-soon',
                category: 'arcade',
                badge: '개발 중',
                badgeColor: 'bg-slate-800 text-slate-400 border-slate-700',
                gradient: 'from-emerald-400 to-teal-500',
                icon: '🏃',
                isReady: false
            },
            {
                id: 'coming-soon-2',
                title: '스피드 타자 왕',
                description: '제한 시간 안에 떨어지는 단어들을 빠르게 입력해 방어하는 타자 게임입니다.',
                url: '#coming-soon',
                category: 'arcade',
                badge: '예정',
                badgeColor: 'bg-slate-800 text-slate-400 border-slate-700',
                gradient: 'from-blue-400 to-indigo-500',
                icon: '⌨️',
                isReady: false
            }
        ];

        const gamesGrid = document.getElementById('games-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const toastModal = document.getElementById('toast-modal');
        const toastMessage = document.getElementById('toast-message');
        let toastTimeout;

        // 커스텀 알림 토스트 표시 함수
        function showToast(msg) {
            toastMessage.textContent = msg;
            toastModal.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastModal.classList.add('hidden');
            }, 2500);
        }

        // 게임 카드 렌더링 함수
        function renderGames(filterCategory = 'all') {
            gamesGrid.innerHTML = '';

            const filteredGames = filterCategory === 'all' 
                ? gamesList 
                : gamesList.filter(game => game.category === filterCategory);

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card group bg-slate-900/60 border border-slate-800/80 hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg';

                card.innerHTML = `
                    <div>
                        <!-- 썸네일 영역 -->
                        <div class="h-44 bg-gradient-to-br ${game.gradient} relative flex items-center justify-center overflow-hidden">
                            <span class="text-6xl transform group-hover:scale-110 transition-transform duration-300 drop-shadow-md">
                                ${game.icon}
                            </span>
                            <span class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-xs font-semibold border backdrop-blur-md ${game.badgeColor}">
                                ${game.badge}
                            </span>
                        </div>
                        
                        <!-- 텍스트 설명 영역 -->
                        <div class="p-6">
                            <h2 class="text-xl font-bold text-white mb-2 group-hover:text-indigo-400 transition-colors">
                                ${game.title}
                            </h2>
                            <p class="text-slate-400 text-sm leading-relaxed">
                                ${game.description}
                            </p>
                        </div>
                    </div>

                    <!-- 하단 플레이 버튼 -->
                    <div class="px-6 pb-6 pt-2">
                        ${game.isReady ? `
                            <a href="${game.url}" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm flex items-center justify-center gap-2 transition-colors shadow-md shadow-indigo-600/20">
                                <span>지금 플레이하기</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        ` : `
                            <button onclick="showToast('${game.title}은(는) 현재 열심히 개발 중입니다!')" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 font-semibold text-sm flex items-center justify-center gap-2 transition-colors cursor-pointer">
                                <span>출시 준비 중</span>
                            </button>
                        `}
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        // 카테고리 필터 이벤트 연결
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 버튼 스타일 초기화
                filterBtns.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-500/20');
                    b.classList.add('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
                });
                // 활성화된 버튼 스타일 적용
                btn.classList.remove('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-500/20');

                renderGames(btn.dataset.category);
            });
        });

        // 초기 렌더링
        renderGames();
    </script>
</body>
</html>
