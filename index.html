    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

        @font-face {
            font-family: 'Galmuri11';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Bold.woff2') format('woff2');

            font-display: swap;
        }

        @font-face {
            font-family: 'Galmuri11';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Condensed.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
            font-stretch: 75%;
        }

        body {
            font-family: 'Galmuri11', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #2c1608;
            /* 모눈종이 격자 무늬를 앞에 배치하고 가을 느낌 그라데이션을 뒤에 배치 */
            background-image: 
                linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(22, 16, 38, 1) 0%, rgba(132, 53, 10, 0.9) 60%, rgba(217, 119, 6, 1) 100%);
            background-size: 28px 28px, 28px 28px, 100% 100%;
            background-attachment: fixed;
            color: #ffffff;
        }

        /* 장체 적용 유틸리티 클래스 */
        .font-condensed {
            font-stretch: 75%;
        }

        /* 레트로 3D 입체 타이틀 텍스트 */
        .arcade-title {
            background: linear-gradient(180deg, #ffe047 0%, #ff9900 55%, #ff5e00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 0px #7c2d12) drop-shadow(0px 6px 0px #1e1035);
            letter-spacing: 0.04em;
        }

        /* 둥둥 떠다니는 픽셀 장식 애니메이션 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(6deg); }
        }
        .pixel-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* 게임 카드 네온 호버 효과 */
        .arcade-card {
            background-color: #1c1738;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .arcade-card:hover {
            transform: translateY(-6px);
        }

        /* 스티커 뱃지 스타일 */
        .sticker-badge {
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.45);
            transform: rotate(-8deg);
            transition: transform 0.2s ease;
        }
        .sticker-badge:hover {
            transform: rotate(-2deg) scale(1.05);
        }

        /* 오락실 안내 문구 딱딱 끊어지는 깜빡임 애니메이션 */
        @keyframes arcadeStepBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .arcade-blink {
            animation: arcadeStepBlink 1.6s steps(1, end) infinite;
        }

        /* 페이지 오픈 시 느렸다가 빨랐다가 느려지는 전체 확대 애니메이션 */
        @keyframes arcadeScreenZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.82);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .page-zoom-enter {
            animation: arcadeScreenZoomIn 1.1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
            transform-origin: center center;
        }
    </style>
</head>

        let toastTimeout;

        // 커스텀 알림 토스트 표시 함수
        function showToast(msg) {
            toastMessage.textContent = msg;
            toastModal.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastModal.classList.add('hidden');
            }, 2500);
        }

        // 카테고리별 개수 업데이트
        function updateCategoryCounts() {
            document.getElementById('total-games-count').textContent = gamesList.length;
            filterBtns.forEach(btn => {
                const cat = btn.dataset.category;
                const count = cat === 'all' 
                    ? gamesList.length 
                    : gamesList.filter(g => g.category === cat).length;
                const badge = btn.querySelector('.count-badge');
                if (badge) badge.textContent = count;
            });
        }

        // 게임 카드 렌더링 함수
        function renderGames(filterCategory = 'all') {
            gamesGrid.innerHTML = '';

            const filteredGames = filterCategory === 'all' 
                ? gamesList 
                : gamesList.filter(game => game.category === filterCategory);

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'arcade-card relative border-[3px] p-6 pt-8 flex flex-col items-center text-center justify-between cursor-pointer group';
                card.style.borderColor = game.themeColor;
                card.style.boxShadow = `0 0 20px ${game.glowColor}, inset 0 0 15px rgba(0,0,0,0.4)`;
                card.onclick = () => openGameModal(game.id);

                const tagsHtml = game.tags.map(tag => `
                    <span class="px-2 py-1 bg-[#130f26] border border-[#3b3363] text-slate-300 text-[11px] font-bold">
                        ${tag}
                    </span>
                `).join('');

                card.innerHTML = `
                    <!-- 좌측 상단 라벨 탭 -->
                    <div class="absolute -top-3.5 left-4 px-2.5 py-0.5 text-xs font-bold tracking-wider text-[#121629] group-hover:-translate-y-1 transition-transform"
                         style="background-color: ${game.themeColor};">
                        ${game.gameNumber}
                    </div>

                    <div class="w-full flex flex-col items-center">
                        <!-- 중앙 픽셀 아이콘 프레임 -->
                        <div class="w-24 h-24 mb-5 bg-[#120e24] border-2 border-[#3b3363] p-2 flex items-center justify-center shadow-inner group-hover:scale-105 transition-transform">
                            <div class="w-full h-full bg-gradient-to-br ${game.iconBg} flex items-center justify-center border border-black/40">
                                <span class="text-4xl drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)]">
                                    ${game.icon}
                                </span>
                            </div>
                        </div>

                        <!-- 게임 제목 -->
                        <h2 class="text-lg sm:text-xl font-bold text-white mb-2.5 tracking-wide font-condensed">
                            ${game.title}
                        </h2>

                        <!-- 노란색 등급/상태 뱃지 -->
                        <div class="inline-block px-3 py-0.5 mb-3 border border-amber-400/80 bg-amber-400/10 text-amber-300 text-xs font-bold">
                            ${game.subBadge}
                        </div>

                        <!-- 게임 설명 -->
                        <p class="text-slate-300 text-xs leading-relaxed mb-4 line-clamp-2 px-1 font-condensed">
                            ${game.description}
                        </p>

                        <!-- 해시태그 박스 -->
                        <div class="flex flex-wrap justify-center gap-1.5 mb-2">
                            ${tagsHtml}
                        </div>

                        <div class="mt-3 text-[10px] text-slate-500 group-hover:text-amber-300 transition-colors tracking-widest">
                            [ 클릭해서 상세보기 ]
                        </div>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        // --- 팝업(모달) 제어 함수 ---
        const gameModal = document.getElementById('game-modal');
        const gameModalContent = document.getElementById('game-modal-content');

        // 카테고리를 한글로 변환
        function getCategoryText(cat) {
            if (cat === 'multi') return '멀티 / 파티';
            if (cat === 'arcade') return '아케이드 / 퍼즐';
            if (cat === 'teacher') return '선생님용 도구';
            return '기타';
        }

        function openGameModal(gameId) {
            const game = gamesList.find(g => g.id === gameId);
            if (!game) return;

            // 데이터 채우기
            document.getElementById('modal-game-number').textContent = game.gameNumber;
            document.getElementById('modal-icon').textContent = game.icon;
            document.getElementById('modal-icon-bg').className = `w-full h-full bg-gradient-to-br ${game.iconBg} flex items-center justify-center border border-black/40`;
            document.getElementById('modal-title').textContent = game.title;
            document.getElementById('modal-category-text').textContent = getCategoryText(game.category);
            document.getElementById('modal-badge').textContent = game.subBadge;
            document.getElementById('modal-desc').innerHTML = game.description;

            // 태그 렌더링
            const tagsHtml = game.tags.map(tag => `
                <span class="px-2 py-1 bg-[#130f26] border border-[#3b3363] text-slate-300 text-[11px] font-bold">
                    ${tag}
                </span>
            `).join('');
            document.getElementById('modal-tags').innerHTML = tagsHtml;

            // 게임 시작 / 이동 버튼 렌더링
            const actionContainer = document.getElementById('modal-action-container');
            if (game.isReady) {
                const buttonText = game.actionLabel || '▶ 게임 시작';
                actionContainer.innerHTML = `
                    <a href="${game.url}" class="block w-full bg-amber-400 text-[#1e193b] text-center font-bold py-3.5 text-lg sm:text-xl shadow-[4px_4px_0px_#000] hover:-translate-y-0.5 hover:shadow-[4px_6px_0px_#000] active:translate-y-1 active:shadow-[0_0_0_#000] transition-all">
                        ${buttonText}
                    </a>
                `;
            } else {
                actionContainer.innerHTML = `
                    <button onclick="showToast('${game.title}은(는) 현재 열심히 개발 중입니다!')" class="w-full bg-[#120e24] border-2 border-amber-400 text-amber-400 text-center font-bold py-3 text-lg sm:text-xl shadow-[4px_4px_0px_#000] hover:-translate-y-0.5 active:translate-y-1 active:shadow-[0_0_0_#000] transition-all cursor-pointer">
                        ■ 개발 중 (COMING SOON)
                    </button>
                `;
            }

            // 모달 표시
            gameModal.classList.remove('hidden');
            gameModal.classList.add('flex');
            setTimeout(() => {
                gameModal.classList.remove('opacity-0');
                gameModalContent.classList.remove('scale-95');
                gameModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeGameModal() {
            gameModal.classList.add('opacity-0');
            gameModalContent.classList.remove('scale-100');
            gameModalContent.classList.add('scale-95');
            
            setTimeout(() => {
                gameModal.classList.add('hidden');
                gameModal.classList.remove('flex');
            }, 300);
        }

        // 모달 바깥 어두운 배경 클릭 시 모달 닫기
        gameModal.addEventListener('click', (e) => {
            if (e.target === gameModal) {
                closeGameModal();
            }
        });

        // 카테고리 필터 이벤트 연결
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-[#4ade80]', 'text-[#121629]', 'border-[#4ade80]', 'shadow-[0_0_12px_rgba(74,222,128,0.4)]');
                    b.classList.add('bg-[#1e193b]', 'text-slate-300', 'border-[#3b3363]');
                    const badge = b.querySelector('.count-badge');
                    if (badge) badge.classList.add('text-slate-400');
                });

                btn.classList.remove('bg-[#1e193b]', 'text-slate-300', 'border-[#3b3363]');
                btn.classList.add('bg-[#4ade80]', 'text-[#121629]', 'border-[#4ade80]', 'shadow-[0_0_12px_rgba(74,222,128,0.4)]');
                const activeBadge = btn.querySelector('.count-badge');
                if (activeBadge) activeBadge.classList.remove('text-slate-400');

                renderGames(btn.dataset.category);
            });
        });

        // 초기 실행
        updateCategoryCounts();
        renderGames();
    </script>
</body>
</html>
